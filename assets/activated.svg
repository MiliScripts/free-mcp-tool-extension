<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="actGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#actGrad)" filter="url(#actGlow)"/>

  <!-- Inner Subtle Ring -->
  <rect x="3.5" y="3.5" width="41" height="41" rx="10.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Center Shield Icon -->
  <path d="M24 10 L34 14.5 V22.5 C34 28.5 24 33.5 24 33.5 C24 33.5 14 28.5 14 22.5 V14.5 L24 10 Z" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>

  <!-- Checkmark -->
  <path d="M19.5 22 L22.5 25 L28.5 18" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
