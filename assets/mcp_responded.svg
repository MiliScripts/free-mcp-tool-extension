<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#090b10; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 14px;">
  <defs>
    <linearGradient id="aiBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="mcpRespondedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="codeBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <filter id="mcpGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Browser Chrome Header -->
  <rect x="0" y="0" width="900" height="42" fill="#11131c" rx="14" ry="14"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <rect x="180" y="9" width="540" height="24" rx="7" fill="#1a1d2b"/>
  <text x="450" y="25" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">https://chat.deepseek.com [Autonomous MCP Execution Loop]</text>

  <g transform="translate(40, 60)">
    <!-- Section Title Card -->
    <g transform="translate(0, 0)">
      <rect width="820" height="430" rx="16" fill="#0d111a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow2)"/>
    </g>

    <!-- Header Badge -->
    <g transform="translate(24, 20)">
      <rect width="210" height="30" rx="15" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#10b981"/>
      <text x="28" y="19" fill="#34d399" font-size="11.5" font-weight="700">MCP TOOL RESPONDED ✓</text>

      <text x="230" y="20" fill="#f8fafc" font-size="16" font-weight="700">Autonomous Server Tool Execution &amp; Feedback Loop</text>
    </g>

    <line x1="24" y1="62" x2="796" y2="62" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Left Box: Intercepted Tool Call & Execution Request -->
    <g transform="translate(24, 80)">
      <rect width="370" height="325" rx="14" fill="#131722" stroke="rgba(59,130,246,0.25)" stroke-width="1.2"/>
      
      <!-- Top Title Bar -->
      <rect width="370" height="36" rx="14" fill="#1e2436"/>
      <text x="16" y="23" fill="#60a5fa" font-size="12" font-weight="700">1. AI Intercepted Tool Call Request</text>
      
      <!-- Content -->
      <g transform="translate(14, 48)">
        <text x="0" y="18" fill="#94a3b8" font-size="11.5">Model output detected in Web LLM Chat:</text>

        <!-- Code Box -->
        <rect y="28" width="342" height="70" rx="8" fill="url(#codeBoxGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="12" y="52" fill="#f43f5e" font-size="11" font-family="monospace">[[TOOL_CALL: get_jalali_date]]</text>
        <text x="12" y="74" fill="#a7f3d0" font-size="11" font-family="monospace">Arguments: {}</text>

        <!-- Step arrow indicator -->
        <text x="0" y="122" fill="#94a3b8" font-size="11.5">Background Service Worker dispatching JSON-RPC:</text>

        <!-- HTTP Request Mockup -->
        <rect y="132" width="342" height="96" rx="8" fill="url(#codeBoxGrad)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
        <text x="12" y="154" fill="#60a5fa" font-size="11" font-family="monospace">POST /mcp HTTP/1.1</text>
        <text x="12" y="174" fill="#94a3b8" font-size="10.5" font-family="monospace">Host: mcpdate.kamyaarsr.workers.dev</text>
        <text x="12" y="194" fill="#cbd5e1" font-size="10.5" font-family="monospace">{"method": "tools/call", "id": 101}</text>
        <text x="12" y="214" fill="#cbd5e1" font-size="10.5" font-family="monospace">{"params": {"name": "get_jalali_date"}}</text>
      </g>
    </g>

    <!-- Center Arrow Connector -->
    <g transform="translate(402, 220)">
      <circle cx="8" cy="8" r="16" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
      <path d="M0 8 L12 8 M7 3 L12 8 L7 13" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Right Box: MCP Server Response & Injected Context -->
    <g transform="translate(426, 80)">
      <rect width="370" height="325" rx="14" fill="#131722" stroke="rgba(16,185,129,0.3)" stroke-width="1.2" filter="url(#mcpGlow)"/>

      <!-- Top Title Bar -->
      <rect width="370" height="36" rx="14" fill="url(#mcpRespondedGrad)"/>
      <circle cx="20" cy="18" r="4.5" fill="#34d399"/>
      <text x="32" y="23" fill="#ffffff" font-size="12" font-weight="700">2. MCP Server Responded (200 OK)</text>

      <!-- Content -->
      <g transform="translate(14, 48)">
        <text x="0" y="18" fill="#94a3b8" font-size="11.5">JSON-RPC 2.0 Response received:</text>

        <!-- Response Payload Code Box -->
        <rect y="28" width="342" height="110" rx="8" fill="url(#codeBoxGrad)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
        <text x="12" y="50" fill="#34d399" font-size="10.5" font-family="monospace">{</text>
        <text x="24" y="68" fill="#34d399" font-size="10.5" font-family="monospace">"jsonrpc": "2.0", "id": 101,</text>
        <text x="24" y="86" fill="#34d399" font-size="10.5" font-family="monospace">"result": {</text>
        <text x="36" y="104" fill="#fbbf24" font-size="10.5" font-family="monospace">"content": [{"text": "1405/06/08"}]</text>
        <text x="24" y="122" fill="#34d399" font-size="10.5" font-family="monospace">}</text>
        <text x="12" y="132" fill="#34d399" font-size="10.5" font-family="monospace">}</text>

        <!-- Autonomous Context Injection -->
        <text x="0" y="162" fill="#94a3b8" font-size="11.5">Result fed back into AI conversation:</text>

        <!-- Final AI Answer Mockup -->
        <rect y="172" width="342" height="60" rx="8" fill="url(#aiBubbleGrad)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
        <text x="12" y="194" fill="#a7f3d0" font-size="11.5" font-weight="600">🤖 AI Final Answer:</text>
        <text x="12" y="216" fill="#f8fafc" font-size="11">"Today's Jalali date is Shahrivar 8, 1405."</text>
      </g>
    </g>
  </g>
</svg>
