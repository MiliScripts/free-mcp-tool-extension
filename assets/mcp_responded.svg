<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="respGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="respGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#respGrad)" filter="url(#respGlow)"/>

  <!-- Inner Subtle Ring -->
  <rect x="3.5" y="3.5" width="41" height="41" rx="10.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Server / Data Response Icon -->
  <!-- Code brackets / Server block -->
  <path d="M14 16 L10 20 L14 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 16 L38 20 L34 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Curved Response Return Arrow + Checkmark -->
  <path d="M16 29.5 H28 C31 29.5 33 27.5 33 24.5 C33 21.5 31 19.5 28 19.5 H22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Checkmark Badge Center Bottom -->
  <circle cx="24" cy="31" r="7.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M21 31 L23 33 L27 29" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
