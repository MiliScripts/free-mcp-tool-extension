<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#0b0c10; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="100%" stop-color="#11131a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="900" height="40" fill="#14161f" rx="12" ry="12"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444" />
  <circle cx="45" cy="20" r="6" fill="#f59e0b" />
  <circle cx="65" cy="20" r="6" fill="#10b981" />
  <rect x="180" y="8" width="540" height="24" rx="6" fill="#1f2330"/>
  <text x="450" y="24" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">chrome://extensions (Free MCP Tool Extension)</text>

  <!-- Extension Popup Container -->
  <g transform="translate(245, 55)" filter="url(#shadow)">
    <!-- Popup Background -->
    <rect width="410" height="440" rx="16" fill="#0c0d12" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(18, 18)">
      <rect width="34" height="34" rx="10" fill="url(#primaryGrad)"/>
      <!-- Icon Inside Logo -->
      <polygon points="17,8 6,14 17,20 28,14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <polyline points="6,21 17,27 28,21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      
      <text x="44" y="16" fill="#f8fafc" font-size="15" font-weight="700">Free MCP Tool Extension</text>
      <text x="44" y="30" fill="#94a3b8" font-size="11">Tool Router &amp; Model Client</text>

      <!-- Badge -->
      <rect x="290" y="6" width="84" height="22" rx="11" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <circle cx="302" cy="17" r="3.5" fill="#10b981"/>
      <text x="312" y="21" fill="#34d399" font-size="11" font-weight="600">1 Server</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="70" x2="392" y2="70" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Input Box -->
    <g transform="translate(18, 85)">
      <rect width="374" height="38" rx="19" fill="#161822" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <circle cx="22" cy="19" r="6" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <line x1="26" y1="23" x2="30" y2="27" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      <text x="38" y="23" fill="#64748b" font-size="11.5" font-family="monospace">https://api.example.com/mcp</text>
      
      <rect x="316" y="4" width="52" height="30" rx="15" fill="#3b82f6"/>
      <text x="342" y="23" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">+ Add</text>
    </g>

    <!-- Section Title -->
    <text x="18" y="148" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.5">CONFIGURED SERVERS</text>
    <text x="392" y="148" fill="#10b981" font-size="10.5" font-weight="600" text-anchor="end">2 Tools Ready</text>

    <!-- Server Card 1 -->
    <g transform="translate(18, 160)">
      <rect width="374" height="110" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Card Top -->
      <circle cx="20" cy="24" r="4.5" fill="#10b981"/>
      <text x="32" y="28" fill="#e2e8f0" font-size="12" font-weight="600" font-family="monospace">https://mcpdate.kamyaarsr.workers.dev/mcp</text>
      
      <!-- Toggle Switch (ON) -->
      <rect x="326" y="15" width="34" height="18" rx="9" fill="#10b981"/>
      <circle cx="349" cy="24" r="7" fill="#ffffff"/>

      <!-- Tools Drawer Divider -->
      <line x1="12" y1="48" x2="362" y2="48" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>

      <!-- Tool Pills -->
      <g transform="translate(12, 60)">
        <rect width="112" height="24" rx="12" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
        <text x="56" y="16" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">✓ get_date</text>

        <rect x="120" width="154" height="24" rx="12" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
        <text x="197" y="16" fill="#93c5fd" font-size="11" font-family="monospace" text-anchor="middle">✓ get_jalali_date</text>
      </g>
    </g>

    <!-- Footer Notice -->
    <g transform="translate(18, 385)">
      <rect width="374" height="36" rx="10" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.18)" stroke-width="1"/>
      <text x="187" y="22" fill="#93c5fd" font-size="11" text-anchor="middle">✨ Compatible with DeepSeek, Gemini, Qwen &amp; more</text>
    </g>
  </g>
</svg>
